name: R1 local pilot validation
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: r1-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  test:
    if: github.head_ref == 'feat/42-r1-local-pilot'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install locked dependencies
        run: npx --yes yarn@1.22.22 install --frozen-lockfile
      - name: Run all tests
        run: npm test -- --watchAll=false --runInBand
      - name: Build (strict)
        run: npm run build
