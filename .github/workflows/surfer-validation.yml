name: Surfer validation
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: surfer-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.head_ref == 'feat/33-rigged-asset-review' || github.head_ref == 'feat/37-board-surfer-motion' || github.head_ref == 'feat/40-local-player-appearance'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install locked dependencies
        run: npx --yes yarn@1.22.22 install --frozen-lockfile
      - name: Jest
        run: npm test -- --watchAll=false --runInBand
      - name: Strict build
        id: strict
        if: success() || failure()
        run: npm run build
      - name: Build for visual review if strict build failed
        if: failure() && steps.strict.outcome == 'failure'
        env:
          CI: 'false'
        run: npm run build
      - name: Capture real WebGL review
        if: (success() || failure()) && hashFiles('build/index.html') != ''
        run: |
          npm install --prefix "$RUNNER_TEMP/surf-browser" --no-save --ignore-scripts playwright-core@1.51.1
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/surf-browser/node_modules/playwright-core"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory build &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for i in {1..20}; do curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node scripts/validate-surfer-webgl.cjs
      - name: Verify approved male selection and board
        if: (success() || failure()) && hashFiles('build/index.html') != ''
        id: male-review
        run: |
          mkdir -p artifacts/male-review
          cp public/assets/surfers/man-base-character-rigged.glb artifacts/male-review/man-base-character-rigged.glb
          node scripts/inspect-male-candidate.cjs artifacts/male-review/man-base-character-rigged.glb
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/surf-browser/node_modules/playwright-core"
          export SURFER_CANDIDATE_GLB="$PWD/artifacts/male-review/man-base-character-rigged.glb"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory build &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for i in {1..20}; do curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node scripts/validate-surfer-webgl.cjs
      - name: Male candidate review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: male-candidate-review
          path: artifacts/male-review/
          if-no-files-found: warn
          retention-days: 3
      - name: Review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surfer-webgl-review
          path: artifacts/surfer-review/
          if-no-files-found: warn
          retention-days: 3
